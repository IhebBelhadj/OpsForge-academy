# sqlc: typed Go for each module's queries.sql on PostgreSQL (make gen), database/sql over the pgx/v5 driver.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/platform/postgres/queries.sql
    gen:
      go: &go
        package: postgres
        out: internal/platform/postgres
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          # a document that may be absent: nil is NULL (a named []byte type cannot scan NULL)
          - db_type: jsonb
            nullable: true
            go_type: { type: "[]byte" }
  - engine: postgresql
    schema: migrations
    queries: internal/identity/postgres/queries.sql
    gen:
      go:
        <<: *go
        out: internal/identity/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/catalog/postgres/queries.sql
    gen:
      go:
        <<: *go
        out: internal/catalog/postgres
