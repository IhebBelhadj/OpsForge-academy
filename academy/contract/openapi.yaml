openapi: 3.1.0
info:
  title: OpsForge API
  version: "1.0"
  description: >-
    `opsforge api serve` (lab/apiserver.py): the documents of toolchain.schema.json over HTTP, so a client (OpsForge
    Academy) drives the lab without this checkout or this machine. Contract 1 (the major is in the path and in every
    document's `contract`), minor 0: see README.md for the versioning rules. Every call but `GET /v1/version` needs
    the bearer token of `.opsforge/api-token`; requests carrying an Origin header (browsers) are refused with 403,
    and on a loopback address a Host other than it gets 421. Errors are problem documents
    (application/problem+json).
servers:
  - url: http://127.0.0.1:8091
security:
  - token: []
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: The contract version and OpsForge release (readiness; no token)
      security: []
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/versionOutput" }
  /v1/state:
    get:
      operationId: getState
      summary: The lab now (instances, live links, faults, placeholders); as `opsforge api state`
      responses:
        "200":
          description: The lab state (golden/state.*.json)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/steps/validate:
    post:
      operationId: validateSteps
      summary: Why sets of scenario steps would not run, without running them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/stepsInput" }
      responses:
        "200":
          description: The errors, by set
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/stepsOutput" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/runs:
    post:
      operationId: startRun
      summary: Runs a lab's setup or teardown steps as a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/runInput" }
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/probes:
    post:
      operationId: startProbe
      summary: Runs a probe check as a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/probeInput" }
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/heal:
    post:
      operationId: startHeal
      summary: Puts every link back to its state from before the first fault, as a job
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/jobs/{job}:
    get:
      operationId: getJob
      summary: A job; with `wait`, answers as soon as it is done or after that many seconds (at most 60)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{16}$" } }
        - { name: wait, in: query, schema: { type: number, minimum: 0, maximum: 60 } }
      responses:
        "200":
          description: The job (running, done or failed); finished jobs are kept an hour, none survive a restart
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/jobOutput" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/{ws}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    put:
      operationId: createWorkspace
      summary: Makes an empty workspace (`.opsforge/workspaces/<ws>/`)
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorkspace
      summary: Deletes a workspace and everything in it
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/{ws}/files:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      operationId: listFiles
      summary: The workspace's regular files, by path (links and other files are not listed)
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/filesOutput" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/{ws}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: path
        in: path
        required: true
        description: >-
          A relative path inside the workspace (slashes as is; no `..`, `.`, empty segment, backslash or NUL; at
          most 512 bytes). No path goes through a link.
        schema: { type: string }
    get:
      operationId: readFile
      summary: A file's bytes
      responses:
        "200":
          description: The content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeFile
      summary: Replaces (or creates, with its folders) a file; at most 1 MiB, 10 MiB per workspace
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFile
      summary: Deletes a file
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/workspaces/{ws}/moves:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      operationId: moveFile
      summary: Moves a file (creating the target's folders); 409 if the target exists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/moveInput" }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/terminal:
    get:
      operationId: openTerminal
      summary: >-
        A shell on the lab host over a WebSocket (bash on a pty, `opsforge` as a function, started in the workspace
        when given). Client frames are text JSON `{"t": "i", "d": input}` or `{"t": "r", "cols", "rows"}`; server
        frames are the binary output; the server closes with 1000 when the shell exits, and closing the socket hangs
        the shell up.
      parameters:
        - { name: workspace, in: query, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" } }
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 80 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 24 } }
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The content of `.opsforge/api-token` (made on the first `opsforge api serve`, mode 0600)
  parameters:
    Workspace:
      name: ws
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
  responses:
    Problem:
      description: >-
        A problem: 400 bad input or path, 401 no or wrong token, 403 a browser's request, 404 not found, 409 busy lab
        or existing target, 413 too large, 421 wrong Host, 500 internal
      content:
        application/problem+json:
          schema: { $ref: "./toolchain.schema.json#/$defs/problem" }
    JobStarted:
      description: The job, running; Location is its URL
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "./toolchain.schema.json#/$defs/jobOutput" }
