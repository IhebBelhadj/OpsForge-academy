openapi: 3.1.0
info:
  title: OpsForge API
  version: "1.0"
  description: >-
    `opsforge api serve` (lab/apiserver.py): the documents of toolchain.schema.json over HTTP, so a client (OpsForge
    Academy) drives the lab without this checkout or this machine. A client's lab work happens in sandboxes: one per
    attempt, created from its requirements, cleaned up by OpsForge. Contract 1 (the major is in the path and in every
    document's `contract`), minor 0: see README.md for the versioning rules. Every call but `GET /v1/version` needs
    the bearer token of `.opsforge/api-token`; requests carrying an Origin header (browsers) are refused with 403,
    and on a loopback address a Host other than it gets 421. Errors are problem documents
    (application/problem+json).
servers:
  - url: http://127.0.0.1:8091
security:
  - token: []
paths:
  /v1/version:
    get:
      operationId: getVersion
      summary: The contract version and OpsForge release (readiness; no token)
      security: []
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/versionOutput" }
  /v1/state:
    get:
      operationId: getState
      summary: The lab now (instances, live links, faults, placeholders); as `opsforge api state`
      responses:
        "200":
          description: The lab state (golden/state.*.json)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/steps/validate:
    post:
      operationId: validateSteps
      summary: Why sets of scenario steps would not run, without running them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/stepsInput" }
      responses:
        "200":
          description: The errors, by set
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/stepsOutput" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/heal:
    post:
      operationId: startHeal
      summary: Puts every link back to its state from before the first fault, as a job (the lab owner's escape hatch)
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/jobs/{job}:
    get:
      operationId: getJob
      summary: A job; with `wait`, answers as soon as it is done or after that many seconds (at most 60)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{16}$" } }
        - { name: wait, in: query, schema: { type: number, minimum: 0, maximum: 60 } }
      responses:
        "200":
          description: The job (running, done or failed); finished jobs are kept an hour, none survive a restart
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/jobOutput" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes:
    get:
      operationId: listSandboxes
      summary: The sandboxes alive (and failed ones not deleted yet)
      responses:
        "200":
          description: The sandboxes, oldest first
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/sandboxesOutput" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSandbox
      summary: >-
        Creates a sandbox for one lab or challenge attempt, as a job (the job's `sandbox` is its id from the 202 on;
        its output is the sandbox, `ready` or `failed`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/sandboxInput" }
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    get:
      operationId: getSandbox
      summary: A sandbox (a call keeps it from expiring)
      responses:
        "200":
          description: The sandbox
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/sandboxOutput" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSandbox
      summary: >-
        Deletes a sandbox, as a job: its terminals hung up, `teardown`, its namespace, `heal` when it had faults, its
        workspace (output: the sandbox, `deleted`, with the teardown's output)
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/reset:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    post:
      operationId: resetSandbox
      summary: Runs `teardown` then `setup` again, as a job (the workspace is kept; output the sandbox)
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/probes:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    post:
      operationId: startProbe
      summary: Runs a probe check in a ready sandbox, as a job (fault steps refused; output probeOutput)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/probeInput" }
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/actions:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    post:
      operationId: startAction
      summary: Runs steps in a ready sandbox as a job (a challenge's test action; faults refused; output runOutput)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/actionInput" }
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/files:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    get:
      operationId: listFiles
      summary: The workspace's regular files, by path (links and other files are not listed)
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema: { $ref: "./toolchain.schema.json#/$defs/filesOutput" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
      - name: path
        in: path
        required: true
        description: >-
          A relative path inside the workspace (slashes as is; no `..`, `.`, empty segment, backslash or NUL; at
          most 512 bytes). No path goes through a link.
        schema: { type: string }
    get:
      operationId: readFile
      summary: A file's bytes
      responses:
        "200":
          description: The content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    put:
      operationId: writeFile
      summary: Replaces (or creates, with its folders) a file; at most 1 MiB, 10 MiB per workspace
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteFile
      summary: Deletes a file
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/moves:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    post:
      operationId: moveFile
      summary: Moves a file (creating the target's folders); 409 if the target exists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./toolchain.schema.json#/$defs/moveInput" }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/sandboxes/{sandbox}/terminal:
    parameters:
      - $ref: "#/components/parameters/Sandbox"
    get:
      operationId: openTerminal
      summary: >-
        A shell in the sandbox over a WebSocket: bash on a pty on the lab host, started in its workspace, `opsforge`
        as a function, its namespace as `opsforge kubectl`'s default. Client frames are text JSON `{"t": "i", "d":
        input}` or `{"t": "r", "cols", "rows"}`; server frames are the binary output; the server closes with 1000 when
        the shell exits (or the sandbox is deleted), and closing the socket hangs the shell up.
      parameters:
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 80 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 24 } }
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: The content of `.opsforge/api-token` (made on the first `opsforge api serve`, mode 0600)
  parameters:
    Sandbox:
      name: sandbox
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{8}$" }
  responses:
    Problem:
      description: >-
        A problem: 400 bad input or path, 401 no or wrong token, 403 a browser's request, 404 not found, 409 busy lab
        (lab-busy), lab down (lab-down), unmet requirements (unmet-requirements, with `unmet`), a sandbox not in the
        state the call needs (sandbox-state) or an existing target (exists), 413 too large, 421 wrong Host, 500
        internal
      content:
        application/problem+json:
          schema: { $ref: "./toolchain.schema.json#/$defs/problem" }
    JobStarted:
      description: The job, running; Location is its URL
      headers:
        Location: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "./toolchain.schema.json#/$defs/jobOutput" }
