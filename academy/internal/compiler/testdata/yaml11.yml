bools: [yes, No, on, OFF, true, False, y, n]
ints: [0, -0, +12, 1_000, 0755, 0b101, 0x1F, 1:30, -1:30, 012_3]
floats: [1.5, 1., .5, -2.25, 1.5e+3, 1.5e3, 1e5, 1_000.5, 1:30.5, 0.0001, 0.00001, 100.0, 1.0e+16, 123456789012345678.0, 0.1, -0.0]
nulls: [~, null, Null, ""]
empty:
strs: ["yes", 'on', plain text, "tab\there", "é ü 中文 😀", "<a & b>", "quote \" and \\", "\u007f", "\x01"]
anchor: &a {x: 1, y: [1, 2]}
ref: *a
merge:
  <<: [*a, {z: 3, x: 9}]
  y: own
keys: {1: one, 3: three}
bkeys: {true: t}
block: |
  line one
    indented
  last
folded: >
  folded
  text

  para
crlf: "a\r\nb"
