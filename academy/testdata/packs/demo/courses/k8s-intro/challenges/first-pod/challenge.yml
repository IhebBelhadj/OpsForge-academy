title: First pod
difficulty: easy
minutes: 10
xp: 50
needs: [k3s]
statement: |
  Run one pod named `web` from the image `traefik/whoami`.
files: [pod.yaml]
time_limit: 60s
tests:
  - name: pod is ready
    probe:
      steps:
        - run: { cmd: "./opsforge kubectl -n ${ns} get pod web -o jsonpath='{.status.phase}'" }
          name: phase
      expect: { phase.exit: "== 0" }
hints: [The kind is Pod.]
