title: Meet the cluster
summary: List the nodes and find which site each one is in.
minutes: 10
xp: 100
needs: [k3s]
namespace: auto
files: [hello.yaml]
reset: setup
briefing: |
  The cluster spans three sites.
steps:
  - id: nodes
    title: List the nodes
    body: |
      ```bash
      opsforge kubectl get nodes
      ```
    hints: [Use kubectl get.]
    check:
      probe:
        steps:
          - run: { cmd: "./opsforge kubectl get nodes" }
            name: nodes
        expect:
          nodes.exit: "== 0"
  - id: apply
    title: Apply a manifest
    body: Apply `hello.yaml` in `${ns}`.
    open: hello.yaml
    check: { confirm: Applied }
