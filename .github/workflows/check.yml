---
name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly: the contract tests against OpsForge's master

# OpsForge (the lab) is another repository: the jobs that need its API check it out next to this one
# (OPSFORGE_DIR): master until OpsForge tags v1.0.0, then the release pinned in academy/contract/PINNED (and master
# on the nightly run).
env:
  OPSFORGE_DIR: ${{ github.workspace }}/opsforge

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out OpsForge (its API runs the integration tests and checks the packs' steps)
        uses: actions/checkout@v4
        with:
          repository: IhebBelhadj/OpsForge
          ref: master
          path: opsforge
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpsForge's dependencies (tests run against a throwaway `opsforge api serve`)
        run: pip install pyyaml jsonschema
      - name: Lint (vet, golangci-lint with the layering rules)
        run: make academy-lint
      - name: Test (with the integration tests against OpsForge's API)
        run: make academy-test
      - name: Compile the packs (steps checked by OpsForge's API)
        run: make academy-validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install yamllint
      - name: Shell scripts and YAML
        run: make lint-shell lint-yaml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Typecheck, lint, format, unit tests
        run: make web-check
      - name: Build
        run: make web-build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Generated code is up to date (sqlc, oapi-codegen, wire, openapi-typescript, routes)
        run: make gen-check

  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies and browsers
        run: make web-deps && cd web && pnpm exec playwright install --with-deps chromium firefox
      - name: Build academy and run Playwright (fake OpsForge API)
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
