---
name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly: the contract tests against OpsForge's master

# OpsForge (the lab) is another project: the go job runs its API as a service, outside this checkout, and gives
# Academy only its URL and token (as on separate machines). OPSFORGE_REF: master until OpsForge tags v1.0.0, then the
# release pinned in academy/contract/PINNED (and master on the nightly run).
env:
  OPSFORGE_REPO: https://github.com/IhebBelhadj/OpsForge.git
  OPSFORGE_REF: master

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start OpsForge's API (the integration tests run against it; it checks the packs' steps)
        run: |
          git clone -q --depth 1 --branch "$OPSFORGE_REF" "$OPSFORGE_REPO" "$RUNNER_TEMP/opsforge"
          pip install pyyaml jsonschema
          nohup "$RUNNER_TEMP/opsforge/opsforge" api serve --port 8091 --data "$RUNNER_TEMP/opsforge-api" \
            >"$RUNNER_TEMP/opsforge-api.log" 2>&1 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8091/v1/version && break; sleep 0.2; done
          echo "ACADEMY_OPSFORGE_URL=http://127.0.0.1:8091" >>"$GITHUB_ENV"
          echo "ACADEMY_OPSFORGE_TOKEN_FILE=$RUNNER_TEMP/opsforge-api/api-token" >>"$GITHUB_ENV"
      - name: Lint (vet, golangci-lint with the layering rules)
        run: make academy-lint
      - name: Test (with the integration tests against OpsForge's API)
        run: make academy-test
      - name: Compile the packs (steps checked by OpsForge's API)
        run: make academy-validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install yamllint
      - name: Shell scripts, YAML, the pinned contract
        run: make lint-shell lint-yaml contract-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Typecheck, lint, format, unit tests
        run: make web-check
      - name: Build
        run: make web-build

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Generated code is up to date (sqlc, oapi-codegen, wire, openapi-typescript, routes)
        run: make gen-check

  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: academy/go.mod
          cache-dependency-path: academy/**/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies and browsers
        run: make web-deps && cd web && pnpm exec playwright install --with-deps chromium firefox
      - name: Build academy and run Playwright (fake OpsForge API)
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
