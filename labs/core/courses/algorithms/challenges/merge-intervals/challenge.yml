kind: code
title: Merge Intervals
difficulty: medium
minutes: 25
xp: 100
statement: |
  Given a list of `intervals` where `intervals[i] = [start, end]`, merge every overlapping interval and return the
  intervals that remain, **sorted by start**.

  Two intervals overlap when one starts before or when the other ends: `[1, 4]` and `[4, 5]` merge into `[1, 5]`.

  **Example 1**

  ```
  Input:  intervals = [[1, 3], [2, 6], [8, 10], [15, 18]]
  Output: [[1, 6], [8, 10], [15, 18]]
  ```

  `[1, 3]` and `[2, 6]` overlap, so they become `[1, 6]`.

  **Example 2**

  ```
  Input:  intervals = [[1, 4], [4, 5]]
  Output: [[1, 5]]
  ```

  **Constraints**

  - `1 <= len(intervals) <= 10^4`
  - `0 <= start <= end <= 10^4`
  - The input is not sorted.
function: merge
params: [intervals]
samples: 2
time_limit: 10s
hints:
  - If the intervals were sorted by start, which ones could overlap the interval you are looking at?
  - Sort by start, then walk once, either extending the last merged interval or starting a new one.
cases:
  - { args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], want: [[1, 6], [8, 10], [15, 18]] }
  - { args: [[[1, 4], [4, 5]]], want: [[1, 5]] }
  - { args: [[[1, 4], [0, 4]]], want: [[0, 4]] }
  - { args: [[[5, 7]]], want: [[5, 7]] }
  - { args: [[[1, 4], [2, 3]]], want: [[1, 4]] }
  - { args: [[[8, 10], [1, 3], [2, 6], [15, 18], [17, 20]]], want: [[1, 6], [8, 10], [15, 20]] }
  - { args: [[[1, 2], [3, 4], [5, 6]]], want: [[1, 2], [3, 4], [5, 6]] }
  - { args: [[[2, 3], [4, 5], [6, 7], [8, 9], [1, 10]]], want: [[1, 10]] }
