title: Scale across regions
summary: Run your own deployment, spread it over the regions and scale it.
minutes: 20
xp: 150
layout: stretched
needs: [k3s]
requires: [nodes-and-regions]
concepts: [Deployment, replicas, topology spread]
briefing: |
  A Deployment keeps a number of identical pods running. On its own, the scheduler only *prefers* to spread them
  over nodes: when nodes are busy or full it will happily put them all in one region, where one outage takes them
  all. A topology spread constraint turns that preference into a rule, per region. You will create a deployment,
  require it to spread by region, and scale it.

  The lab has created an empty namespace called `lab` for you.
setup:
  - run:
      cmd: >-
        opsforge kubectl create namespace lab --dry-run=client -o yaml | opsforge kubectl apply -f - >/dev/null
steps:
  - id: create
    title: Create a deployment with three replicas
    body: |
      ```
      opsforge kubectl -n lab create deployment web --image=traefik/whoami:v1.11.0 --replicas=3
      ```

      Wait until all three are ready:

      ```
      opsforge kubectl -n lab get deploy web -w
      ```
    check:
      probe:
        steps:
          - run: { cmd: "opsforge kubectl -n lab get deploy web -o jsonpath='{.status.readyReplicas}'" }
            name: ready
        expect:
          ready.value: "== 3"
  - id: spread
    title: Spread it over the regions
    body: |
      Add a topology spread constraint on the region label, so no region holds more than one pod more than another.
      Edit the deployment (`opsforge kubectl -n lab edit deploy web`) and add under `spec.template.spec`:

      ```yaml
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web
          matchLabelKeys: [pod-template-hash]
      ```

      Changing the pod template rolls the pods out again, and the new ones are placed by the constraint.
      `matchLabelKeys` makes it count only pods of the same revision: without it, the old pods still being replaced
      count too, and the new ones pile up in the regions the old ones are leaving.
    hints:
      - |
        Without an editor, patch it in one go:

        ```
        opsforge kubectl -n lab patch deploy web --type merge -p '
        {"spec": {"template": {"spec": {"topologySpreadConstraints": [
          {"maxSkew": 1, "topologyKey": "topology.kubernetes.io/region", "whenUnsatisfiable": "DoNotSchedule",
           "labelSelector": {"matchLabels": {"app": "web"}}, "matchLabelKeys": ["pod-template-hash"]}]}}}}'
        ```
    check:
      probe:
        steps:
          - run:
              cmd: >-
                opsforge kubectl -n lab get deploy web
                -o jsonpath='{.spec.template.spec.topologySpreadConstraints[0].topologyKey}'
                | grep -qx topology.kubernetes.io/region
            name: constraint
          - wait_until:
              cmd: >-
                opsforge kubectl -n lab rollout status deploy web --timeout=2s >/dev/null &&
                [ "$(opsforge kubectl -n lab get pods -l app=web --field-selector status.phase=Running
                -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u | wc -l)" -eq 3 ]
              timeout: 90s
            name: regions
        expect:
          constraint.exit: "== 0"
          regions.ok: "== 1"
  - id: scale
    title: Scale to five
    body: |
      ```
      opsforge kubectl -n lab scale deploy web --replicas=5
      opsforge kubectl -n lab get pods -o wide
      ```
    check:
      quiz:
        question: With maxSkew 1, how can five pods be split over three regions?
        choices: ["3, 1, 1", "2, 2, 1", "5, 0, 0", "Any split: the constraint only counts nodes"]
        answer: 1
        explain: >
          The difference between the fullest and the emptiest region may be at most 1, so 2/2/1 is the only split.
          A sixth pod would go to the region with one.
teardown:
  - run: { cmd: opsforge kubectl delete namespace lab --wait=false --ignore-not-found }
debrief: |
  Replicas give you capacity; spreading them over failure domains gives you availability.
