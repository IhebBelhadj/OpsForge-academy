title: Losing a site
summary: Cut a region off and watch the cluster notice, wait, and move its work elsewhere.
minutes: 20
xp: 200
layout: stretched
needs: [k3s]
requires: [nodes-and-regions]
concepts: [partition, node conditions, taints, tolerations, eviction]
briefing: |
  A region does not fail politely. From the control plane's point of view, a partitioned node simply stops
  reporting. Kubernetes cannot tell a dead node from an unreachable one, so it waits before giving up on the pods
  there: replacing them too soon could run two copies of something that must run once.

  You will partition site c, then follow the cluster through every stage until its work runs elsewhere, then heal.
steps:
  - id: partition
    title: Partition site c
    body: |
      ```
      opsforge partition c
      ```

      Site c still reaches the internet, but every packet between c and the other sites is now lost.
    check:
      probe:
        steps:
          - run: { cmd: "opsforge link a-c | grep -q 'loss=100%' && opsforge link b-c | grep -q 'loss=100%'" }
            name: cut
        expect:
          cut.exit: "== 0"
  - id: not-ready
    title: Watch the node go unknown
    body: |
      ```
      opsforge kubectl get nodes -w
      ```

      Nodes report every 10 seconds. After 40 seconds without news, the control plane marks the node's `Ready`
      condition `Unknown` and the node shows `NotReady`.
    check:
      probe:
        steps:
          - wait_until:
              cmd: >-
                opsforge kubectl get node ${node:c}
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -qx Unknown
              timeout: 120s
            name: unknown
        expect:
          unknown.ok: "== 1"
  - id: evicted
    title: Wait for the pod to move
    body: |
      ```
      opsforge kubectl -n demo get pods -o wide -w
      ```

      The pod on ${node:c} is not replaced straight away. Look at the taints on the node in the meantime:

      ```
      opsforge kubectl get node ${node:c} -o jsonpath='{.spec.taints}'
      ```
    hints:
      - >-
        The replacement appears about a minute after the node went NotReady. The old pod stays `Terminating`,
        because nobody can reach c to confirm it stopped.
    check:
      probe:
        steps:
          - wait_until:
              cmd: >-
                [ "$(opsforge kubectl -n demo get pods -l app=whoami --field-selector
                spec.nodeName!=${node:c},status.phase=Running -o name | wc -l)" -ge 3 ]
              timeout: 180s
            name: moved
        expect:
          moved.ok: "== 1"
  - id: why-wait
    title: Explain the wait
    body: |
      The node carries the taint `node.kubernetes.io/unreachable:NoExecute`. Every pod gets a toleration for it
      automatically, with a time limit.
    check:
      quiz:
        question: Why did the pod keep running on c for about a minute after the node went NotReady?
        choices:
          - The scheduler only runs once a minute
          - Its toleration for the unreachable taint lasts 60 seconds in this lab (300 by default)
          - The pod's liveness probe had to fail first
        answer: 1
        explain: >
          NoExecute taints evict pods once their toleration expires. The lab shortens it from Kubernetes' default
          of five minutes so you don't wait as long; real clusters trade faster failover against moving work off
          a node that only had a network hiccup.
  - id: heal
    title: Heal the partition
    body: |
      ```
      opsforge heal
      opsforge kubectl get nodes -w
      ```
    check:
      probe:
        steps:
          - wait_until:
              cmd: >-
                opsforge kubectl get node ${node:c}
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -qx True
              timeout: 120s
            name: ready
        expect:
          ready.ok: "== 1"
teardown:
  - heal: true
  # Spread constraints only act at scheduling: roll every spread workload (the demo, the ci node's webapp, ...) so it
  # is one pod per region again, as verify expects. kube-system is left alone.
  - run:
      cmd: |
        q='{range .items[?(@.spec.template.spec.topologySpreadConstraints)]}{.metadata.namespace}/{.metadata.name}{" "}'
        spread=$(opsforge kubectl get deploy -A -o jsonpath="$q{end}")
        for d in $spread; do
          case $d in kube-system/*) continue ;; esac
          opsforge kubectl -n "${d%/*}" rollout restart "deploy/${d#*/}" >/dev/null
        done
        for d in $spread; do
          case $d in kube-system/*) continue ;; esac
          opsforge kubectl -n "${d%/*}" rollout status "deploy/${d#*/}" --timeout=180s
        done
      timeout: 400s
debrief: |
  After healing, the demo was left with two pods in one region and none in c: the spread constraint only acts when
  pods are placed, so nothing moves back by itself. Finishing the lab rolled the spread deployments
  (`opsforge kubectl -n demo rollout restart deploy whoami`, and the same for the webapp if you run the ci node),
  and their new pods were spread one per region again.
